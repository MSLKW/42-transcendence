networks:
  transcendence:
    name : ${NETWORK_NAME}     # name : transcendence
    driver: bridge


volumes:
  db_data:
    name: ${DB_VOLUME_NAME}    # name: postgres_data
    driver: local
    driver_opts:  
      type: none
      o: bind
      device: ${HOME}/data/${DB_VOLUME_NAME}       # device: /home/aimokhta/data/postgres_data


secrets: # auto make all secret files just read only mode
  db_admin_password:
    file: ./secrets/database_passwords/db_admin_password.txt
  db_auth_password:
    file: ./secrets/database_passwords/db_auth_password.txt
  db_website_password:
    file: ./secrets/database_passwords/db_website_password.txt
  db_game_password:
    file: ./secrets/database_passwords/db_game_password.txt
  db_bot_password:
    file: ./secrets/database_passwords/db_bot_password.txt
  db_chat_password:
    file: ./secrets/database_passwords/db_chat_password.txt


services:

# ==============================================================================
#           POSTGRESQL ( RDBMS Database Engine )
#                       *RDBMS = Relational Database Managaement System
# ==============================================================================
  postgresql-rdbms:
    container_name: postgresql-rdbms
    image: postgres:17-bookworm           # No Dockerfile needed here, pull directly from Docker Hub!
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:                          # Postgres Docker image need them through environment - to specifically overwrite the defaults of the first 3 here
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_AUTH_USER_PASSWORD_FILE: /run/secrets/db_auth_password
      POSTGRES_WEBSITE_USER_PASSWORD_FILE: /run/secrets/db_website_password
      POSTGRES_GAME_USER_PASSWORD_FILE: /run/secrets/db_game_password
      POSTGRES_BOT_USER_PASSWORD_FILE: /run/secrets/db_bot_password
      POSTGRES_CHAT_USER_PASSWORD_FILE: /run/secrets/db_chat_password
    secrets:
      - db_admin_password
      - db_auth_password
      - db_website_password
      - db_game_password
      - db_bot_password
      - db_chat_password
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data                                          # volume
      - ./packages/database/init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # to run schema creation script
      - ./packages/database/scripts:/scripts:ro                                   # container executions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transcendence



# ==============================================================================
#           DRIZZLE ( Drizzle-ORM + Drizzle-kit + NODE )
# ==============================================================================
  drizzle-db_tool:
    container_name: drizzle-db_tool
    build:
      context: .
      dockerfile: ./packages/database/Dockerfile
    image: drizzle-db_tool:aisyah
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${DRIZZLE_STUDIO_PORT}:${DRIZZLE_STUDIO_PORT}"
    environment:
      DB_HOST: postgresql-rdbms
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
    secrets:
      - db_admin_password
    env_file:
      - .env
    depends_on:
      postgresql-rdbms:
        condition: service_healthy
    networks:
      - transcendence
    command: ["npm", "run", "db:studio", "--", "--host", "0.0.0.0"]
    # The double dash "--" acts as a separator. It tells npm:
    # "Stop parsing arguments for yourself. Everything after this -- should be passed directly to the command I am executing."



# ==============================================================================
#           Authentication (Backend Microservice)
# ==============================================================================
  auth:
    container_name: auth
    build:
      context: .                                                  # Set workdir to the repo's root
      dockerfile: ./backend-services/authentication/Dockerfile    # Point to the Dockerfile's relative path
    image: auth:jeremy
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    environment:
      DB_HOST: postgresql-rdbms                              # DB_HOST is a standard industry convention
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${POSTGRES_USER}                           # ${POSTGRES_USER_NAME_AUTH}
      DB_PASSWORD_FILE: /run/secrets/db_admin_password
      # DB_USER: ${POSTGRES_USER_NAME_AUTH}                           # ${POSTGRES_USER_NAME_AUTH}
      # DB_PASSWORD_FILE: /run/secrets/db_auth_password
    env_file:
      - .env                                              # Loads global configs
      - backend-services/authentication/.env              # Loads service-specific configs
    secrets:
      - db_admin_password
      # - db_auth_password
    depends_on:
      postgresql-rdbms:
        condition: service_healthy
    networks:
      - transcendence



