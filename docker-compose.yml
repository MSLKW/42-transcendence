networks:
  transcendence: # main goal: need access out to the browser / internet
    name: ${MAIN_NETWORK_NAME}
    driver: bridge 
  database: # main goal: to talk to Postgres ultimately - any container who need to communicate into PostgreSQL must be incuded in this network
    name: ${DB_NETWORK_NAME}
    driver: bridge # anyone outside cannot enter this network
    internal: true # anyone inside cannot go outside this network (talking to external containers or internet/browsers)
  # backend-internal: # specifically for internal API
  #   name: ${INTERNAL_BACKEND_NETWORK_NAME}
  #   driver: bridge
  #   internal: true
  # lobby: # specifically among partys / lobbys
  #   name: ${LOBBY_NETWORK_NAME}
  #   driver: bridge
  #   internal: true


volumes: # industry standard => name volumes => more secure oppose to anyone ever can adjust volumes (data's disk) on host if volumes are bind mounted
  pg-data:
  dg-data:
  website-data:


secrets: # auto make all secret files just read only mode
  db-admin-password:
    file: ./secrets/database-passwords/db-admin-password.txt
  db-auth-password:
    file: ./secrets/database-passwords/db-auth-password.txt
  db-party-manager-password:
    file: ./secrets/database-passwords/db-party-manager-password.txt
  db-profile-system-password:
    file: ./secrets/database-passwords/db-profile-system-password.txt
  db-friends-system-password:
    file: ./secrets/database-passwords/db-friends-system-password.txt
  db-game-stats-password:
    file: ./secrets/database-passwords/db-game-stats-password.txt
  dg-masterpass:
    file: ./secrets/drizzle-gateway/dg-masterpass.txt


services:

  #     POSTGRESQL ( RDBMS Database Engine ), RDBMS = Relational Database Managaement System
  #     INFRASTRUCTURE MICROSERVICE
  postgresql:
    container_name: postgresql
    image: postgres:17-bookworm
    restart: unless-stopped
    expose:
      - "${PGPORT}"
    environment: # Postgres Docker image need them through environment - to specifically overwrite the defaults
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db-admin-password
    secrets:
      - db-admin-password
      - db-auth-password
      - db-party-manager-password
      - db-profile-system-password
      - db-friends-system-password
      - db-game-stats-password
    env_file:
      - .env
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgresql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro # to run complex/specific sql scripts directly to Postgres directly instead of to Drizzle
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5


  #     DRIZZLE-GATEWAY, Database's GUI Dev Tool 
  #     INFRASTRUCTURE MICROSERVICE
  drizzle-gateway:
    container_name: drizzle-gateway
    image: ghcr.io/drizzle-team/gateway:latest
    restart: unless-stopped
    ports:
      - "${DRIZZLE_GATEWAY_PORT}:${DRIZZLE_GATEWAY_PORT}"
    env_file:
      - .env
    environment: # DB_* / PG_* - not recognized as per DG documentation, better use PG* 
      PORT: ${DRIZZLE_GATEWAY_PORT}
      STORE_PATH: /app # Required by Drizzle Gateway
    command:
      - 'export MASTERPASS="$(cat /run/secrets/dg-masterpass)" && exec /gateway'
    volumes:
      - dg-data:/app # Required persistent volume mounting to /app
    networks:
      - transcendence # must need, to open GUI at browser huhu
      - database
    depends_on:
      postgresql:
        condition: service_healthy
  

  #     MIGRATOR (Node.js + Drizzle), One-shot container (or other technical terms, ephemeral containers / job containers)
  #     ONE-SHOT MICORSERVICE => "run once per deploy" job container
  migrator:
    build:
      context: .
      dockerfile: ./infra/migrator/Dockerfile
    pull_policy: never
    image: migrator:aisyah
    container_name: migrator
    restart: no # It runs migrations only, then it exits successfully, the end of this container's life. 
    environment:
      PGPASSWORD: /run/secrets/db-admin-password
    secrets:
      - db-admin-password
    env_file:
      - .env
    networks:
      - database
    depends_on:
      postgresql:
        condition: service_healthy

  
  #     INFRASTRUCTURE MICROSERVICE
  nginx:
    build: infra/nginx
    pull_policy: never
    image: nginx:test
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - transcendence
    depends_on:
      authentication:
        condition: service_healthy


  #     BACKEND MICORSERVICE
  authentication:
    build:
      context: .                                         # Set workdir to the repo's root
      dockerfile: ./services/authentication/Dockerfile    # Point to the Dockerfile's relative path
    pull_policy: never
    image: authentication:test
    container_name: authentication
    restart: unless-stopped
    environment:
      PGUSER: ${PGUSER_AUTH}
      PGPASSWORD: /run/secrets/db-auth-password
    env_file:
      - .env                                              # Loads global configs
    secrets:
      - db-auth-password
    networks:
      - transcendence
      - database
      # - backend-internal
    healthcheck: #! try check internal thru docker exec if they can still communicate thru postgres, with up nginx too
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      migrator:
        condition: service_completed_successfully  # Waits for migrator to finish and exit with code 0
# Health-check
# "CMD" — tells Docker this is the command to run for the healthcheck (as opposed to CMD-SHELL, which would run it through a shell).
# "curl" — the actual program being executed.
# "-s" — silent mode, suppresses curl's progress bar/output.
# "-o", "/dev/null" — redirects the response body to /dev/null (i.e., "I don't care about the content, just whether the request succeeds").
# "http://localhost:3000/" — the URL being hit, on port 3000 of the container itself.


  #     BACKEND MICORSERVICE
  party-manager:
    build:
      context: .                                        # Set workdir to the repo's root
      dockerfile: ./services/party-manager/Dockerfile    # Point to the Dockerfile's relative path
    pull_policy: never
    image: party:test
    container_name: party-manager
    restart: unless-stopped
    environment:
      PGUSER: ${PGUSER_PARTY_MANAGER}
      PGPASSWORD: /run/secrets/db-party-manager-password
    env_file:
      - .env                                             # Loads global configs
    secrets:
      - db-party-manager-password
    networks:
      - transcendence
      - database
      # - backend-internal
      # - lobby
    depends_on:
      migrator:
        condition: service_completed_successfully  # Waits for migrator to finish and exit with code 0


  #     BACKEND MICORSERVICE
  friends-system:
    build:
      context: .                                        # Set workdir to the repo's root
      dockerfile: ./services/friends-system/Dockerfile    # Point to the Dockerfile's relative path
    pull_policy: never
    image: friends:aisyah
    container_name: friends-system
    restart: unless-stopped
    environment:
      PGUSER: ${PGUSER_FRIENDS_SYSTEM}
      PGPASSWORD: /run/secrets/db-friends-system-password
    env_file:
      - .env                                             # Loads global configs
    secrets:
      - db-friends-system-password
    networks:
      - transcendence
      - database
    depends_on:
      migrator:
        condition: service_completed_successfully  # Waits for migrator to finish and exit with code 0


 #     BACKEND MICORSERVICE
  profile-system:
    build:
      context: .                                         # Set workdir to the repo's root
      dockerfile: ./services/profile-system/Dockerfile    # Point to the Dockerfile's relative path
    pull_policy: never
    image: profile:test
    container_name: profile-system
    restart: unless-stopped
    environment:
      PGUSER: ${PGUSER_PROFILE_SYSTEM}
      PGPASSWORD: /run/secrets/db-profile-system-password
    env_file:
