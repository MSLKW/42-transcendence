networks:
  transcendence: # main goal: need access out to the browser / internet
    name: ${MAIN_NETWORK_NAME}
    driver: bridge 
  database: # main goal: to talk to Postgres ultimately - any container who need to communicate into PostgreSQL must be incuded in this network
    name: ${DB_NETWORK_NAME}
    driver: bridge # anyone outside cannot enter this network
    internal: true # anyone inside cannot go outside this network (talking to external containers or internet/browsers)
  # backend-internal: # specifically for internal API
  #   name: ${INTERNAL_BACKEND_NETWORK_NAME}
  #   driver: bridge
  #   internal: true
  # lobby: # specifically among partys / lobbys
  #   name: ${LOBBY_NETWORK_NAME}
  #   driver: bridge
  #   internal: true


volumes: # industry standard => name volumes => more secure oppose to anyone ever can adjust volumes (data's disk) on host if volumes are bind mounted
  pg-data:
  dg-data:
  website-data:


secrets: # auto make all secret files just read only mode
  db-admin-password:
    file: ./secrets/database-passwords/db-admin-password.txt
  db-auth-password:
    file: ./secrets/database-passwords/db-auth-password.txt
  db-party-manager-password:
    file: ./secrets/database-passwords/db-party-manager-password.txt
  db-profile-system-password:
    file: ./secrets/database-passwords/db-profile-system-password.txt
  db-friends-system-password:
    file: ./secrets/database-passwords/db-friends-system-password.txt
  db-game-password:
    file: ./secrets/database-passwords/db-game-password.txt


services:

  #     POSTGRESQL ( RDBMS Database Engine ), RDBMS = Relational Database Managaement System
  #     INFRASTRUCTURE MICROSERVICE
  postgresql:
    container_name: postgresql
    image: postgres:infra
    build: ./infra/postgresql
    pull_policy: missing # to stick to the current version used, previously by default used missing too anyway.
    restart: unless-stopped
    expose:
      - "${PGPORT}"
    environment: # Postgres Docker image need them through environment - to specifically overwrite the defaults
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db-admin-password
    secrets:
      - db-admin-password
      - db-auth-password
      - db-party-manager-password
      - db-profile-system-password
      - db-friends-system-password
      - db-game-password
    env_file:
      - .env
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgresql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5


  #     DRIZZLE-GATEWAY, Database's GUI Dev Tool 
  #     INFRASTRUCTURE MICROSERVICE
  drizzle-gateway:
    container_name: drizzle-gateway
    image: drizzle-gateway:infra
    build: ./infra/drizzle-gateway
    pull_policy: missing # Docker saves version into local machine's cache after the first latest's download, pull_policy: missing (the default) => Docker will keep using that old cached version forever
    restart: unless-stopped
    ports:
      - "${DRIZZLE_GATEWAY_PORT}:${DRIZZLE_GATEWAY_PORT}"
    env_file:
      - .env
    environment: # DB_* / PG_* - not recognized as per DG documentation, better use PG* 
      PORT: ${DRIZZLE_GATEWAY_PORT}
      STORE_PATH: /app
    volumes:
      - dg-data:/app # Required persistent volume mounting to /app
    networks:
      - transcendence # must need this, to enable opening this GUI dev tool at browser
      - database
    depends_on:
      postgresql:
        condition: service_healthy
  

  #     MIGRATOR (Node.js + Drizzle), One-shot container (or other technical terms, ephemeral containers / job containers)
  #     ONE-SHOT MICORSERVICE => "run once per deploy" job container
  migrator:
    container_name: migrator
    image: migrator:infra
    build:
      context: ./infra/migrator
      additional_contexts:
        root: .
    pull_policy: never
    restart: no # one-shot container = It runs psql + migrations only, then, the end (exit 0)! that's the sole purpose of this container's existance. 
    environment:
      PGPASSWORD: /run/secrets/db-admin-password
    secrets:
      - db-admin-password
    env_file:
      - .env
    networks:
      - database
    depends_on:
      postgresql:
        condition: service_healthy

  
  #     INFRASTRUCTURE MICROSERVICE
  nginx:
    container_name: nginx
    image: nginx:infra
    build: ./infra/nginx
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - transcendence
    depends_on:
      authentication:
        condition: service_healthy


  #     BACKEND MICORSERVICE
  authentication:
    container_name: authentication
    image: auth:services
    build:
      context: ./services/authentication                                        # Set workdir to the repo's root
      additional_contexts:
        root: .
        auth-schema: ./packages/postgres/auth-schema
        postgres-client: packages/postgres/postgres-client
    pull_policy: never
    restart: unless-stopped
    environment:
      PGUSER: ${PGUSER_AUTH}
      PGPASSWORD: /run/secrets/db-auth-password
    env_file:
      - .env                                              # Loads global configs
    secrets:
      - db-auth-password
    networks:
      - transcendence
      - database
      # - backend-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      migrator:
        condition: service_completed_successfully  # Waits for migrator to finish and exit with code 0


  #     BACKEND MICORSERVICE
  party-manager:
    container_name: party-manager
    image: party:services
    build:
      context: ./services/party-manager
      additional_contexts:
        root: .
        auth-schema: ./packages/postgres/auth-schema
        party-manager-schema: ./packages/postgres/party-manager-schema
        postgres-client: ./packages/postgres/postgres-client
    pull_policy: never
    restart: unless-stopped
    environment:
      PGUSER: ${PGUSER_PARTY_MANAGER}
      PGPASSWORD: /run/secrets/db-party-manager-password
    env_file:
      - .env                                             # Loads global configs
    secrets:
      - db-party-manager-password
    networks:
      - transcendence
      - database
      # - backend-internal
      # - lobby
    depends_on:
      migrator:
        condition: service_completed_successfully  # Waits for migrator to finish and exit with code 0


  #     BACKEND MICORSERVICE
  friends-system:
    container_name: friends-system
    image: friends:services
    build:
      context: ./services/friends-system
      additional_contexts:
        root: .
        auth-schema: ./packages/postgres/auth-schema
        friends-system-types: ./packages/types/friends-system-types
        friends-system-schema: ./packages/postgres/friends-system-schema
        postgres-client: ./packages/postgres/postgres-client
    pull_policy: never
    restart: unless-stopped
    environment:
      PGUSER: ${PGUSER_FRIENDS_SYSTEM}
      PGPASSWORD: /run/secrets/db-friends-system-password
    env_file:
      - .env                                             # Loads global configs
    secrets:
      - db-friends-system-password
    networks:
      - transcendence
      - database
    depends_on:
      migrator:
        condition: service_completed_successfully  # Waits for migrator to finish and exit with code 0


 #     BACKEND MICORSERVICE
  profile-system:
    container_name: profile-system
    image: profile:services
    build:
      context: ./services/profile-system
      additional_contexts:
        root: .
        auth-schema: ./packages/postgres/auth-schema
        profile-system-types: ./packages/types/profile-system-types
        profile-system-schema: ./packages/postgres/profile-system-schema
        postgres-client: ./packages/postgres/postgres-client
    pull_policy: never
    restart: unless-stopped
    environment:
      PGUSER: ${PGUSER_PROFILE_SYSTEM}
      PGPASSWORD: /run/secrets/db-profile-system-password
    env_file:
      - .env                                             # Loads global configs
    secrets:
      - db-profile-system-password
    networks:
      - transcendence
      - database
      # - backend-internal
    depends_on:
      migrator:
        condition: service_completed_successfully  # Waits for migrator to finish and exit with code 0


