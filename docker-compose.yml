name: big2

services:
  nginx:
    build: nginx
    image: nginx:test
    ports:
      - "80:80"
    restart: unless-stopped

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    image: website:test
    restart: unless-stopped
    volumes:
      - ./website:/app
      - /app/node_modules

  authentication:
    build: authentication
    image: authentication:test
    restart: unless-stopped

  party_manager:
    build: party-manager
    image: party:test
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://authentication:3000
      GAME_SERVICE_URL: http://game:3000

  game:
    build: game
    image: game:test
    restart: unless-stopped

  chat:
    build: chat
    image: chat:test
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://authentication:3000