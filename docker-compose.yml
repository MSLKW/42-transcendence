name: big2

services:
  nginx:
    container_name: nginx
    build: nginx
    image: nginx:test
    ports:
      - "${DOMAIN_PORT}:${DOMAIN_PORT}"
    restart: unless-stopped
    environment:
      DOMAIN_PORT: ${DOMAIN_PORT}
      NGINX_ENVSUBST_FILTER: ^DOMAIN_PORT$
    volumes:
      - avatars:/app/data/avatars:ro
    networks:
      - big2
  
  website:
    container_name: website
    build:
      context: ./website
      dockerfile: Dockerfile
      additional_contexts:
        root: .
        game-types: ./packages/game-types
    image: website:test
    restart: unless-stopped
    volumes: # temporary for vite hmr
      - ./website:/app/website
      - /app/node_modules
      - /app/website/node_modules
    environment:
      DOMAIN_PORT: ${DOMAIN_PORT} # Right now only for vite config, can remove in production
    networks:
      - big2
  
  authentication:
    container_name: authentication
    build:
      context: ./authentication
    image: authentication:test
    restart: unless-stopped
    environment:
      PORT: ${AUTH_SERVICE_PORT}
      SESSION_DURATION_MS: ${AUTH_SERVICE_SESSION_DURATION_MS}
      SESSION_CLEANUP_CRON_SCHEDULE_STRING: ${AUTH_SERVICE_SESSION_CLEANUP_CRON_SCHEDULE_STRING}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL}
    networks:
      - big2

  profile:
    container_name: profile
    build: profile
    image: profile:test
    restart: unless-stopped
    environment:
      PORT: ${PROFILE_SERVICE_PORT}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AVATAR_DIR: ${PROFILE_SERVICE_AVATAR_DIR}
    volumes:
      - avatars:/app/data/avatars
    networks:
      - big2

  party:
    container_name: party
    build:
      context: ./party
    image: party:test
    restart: unless-stopped
    environment:
      PORT: ${PARTY_SERVICE_PORT}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL}
    networks:
      - big2

  game-server:
    container_name: game-server
    build: 
      context: ./game-server
      dockerfile: Dockerfile
      additional_contexts:
        root: .
        game-types: ./packages/game-types
    image: game-server:test
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
    networks:
      - big2

  chat:
    build: chat
    image: chat:test
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
    networks:
      - big2

volumes:
  avatars:

networks:
  big2: