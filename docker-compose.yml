networks:
  transcendence:
    name: ${MAIN_NETWORK_NAME}
    driver: bridge 
  database: # main goal: to talk to Postgres ultimately - anyone who need to read/write into database will be incuded
    name: ${DB_NETWORK_NAME}
    driver: bridge # anyone outside cannot enter this network
    internal: true # anyone inside cannot go outside this network (talking to external containers or internet/browsers)
  # lobby:
  #   name: lobby
  #   driver: bridge


volumes: # industry standard => name volumes => more secure oppose to anyone ever can adjust volumes (data's disk) on host if volumes are bind mounted
  pg_data:
  dg_data:


secrets: # auto make all secret files just read only mode
  db_admin_password:
    file: ./secrets/database_passwords/db_admin_password.txt
  dg_masterpass:
    file: ./secrets/drizzle-gateway/dg_masterpass.txt


services:

  #     POSTGRESQL ( RDBMS Database Engine ), RDBMS = Relational Database Managaement System
  #     INFRASTRUCTURE MICROSERVICE
  postgresql:
    container_name: postgresql
    image: postgres:17-bookworm # No Dockerfile needed here, pull directly from Docker Hub!
    restart: unless-stopped
    expose:
      - "${POSTGRES_PORT}"
    environment: # Postgres Docker image need them through environment - to specifically overwrite the defaults
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data # volume
      - ./infra/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # to run complex/specific sql scripts directly to Postgres automatically instead of to Drizzle
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  #     DRIZZLE-GATEWAY, Database's GUI Dev Tool 
  #     INFRASTRUCTURE MICROSERVICE
  drizzle-gateway:
    container_name: drizzle-gateway
    image: ghcr.io/drizzle-team/gateway:latest
    restart: unless-stopped
    ports:
      - "${DRIZZLE_GATEWAY_PORT}:${DRIZZLE_GATEWAY_PORT}"
    env_file:
      - .env
    environment:
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      MASTERPASS_FILE: /run/secrets/dg_masterpass
      DB_PASSWORD_FILE:  /run/secrets/db_admin_password
      STORE_PATH: /app # Required by Drizzle Gateway
      PORT: ${DRIZZLE_GATEWAY_PORT}
    secrets:
      - dg_masterpass
      - db_admin_password
    volumes:
      - dg_data:/app # Required persistent volume mounting to /app
    networks:
      - transcendence
      - database
    depends_on:
      postgresql:
        condition: service_healthy
  
  #     MIGRATOR (Node.js + Drizzle), One-shot container (or other technical terms, ephemeral containers / job containers)
  #     ONE-SHOT MICORSERVICE
  migrator:
    container_name: migrator
    build:
      context: .
      dockerfile: ./packages/database/Dockerfile
    image: migrator:aisyah
    pull_policy: build
    restart: no # It runs migrations only, then it exits successfully, the end of this container's life. 
    environment:
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
    env_file:
      - .env
    networks:
      - transcendence
      - database
    depends_on:
      postgresql:
        condition: service_healthy
  
  #     INFRASTRUCTURE MICROSERVICE
  nginx:
    build: nginx
    image: nginx:test
    ports:
      - "80:80"
    restart: unless-stopped
  
  #     FRONTEND MICORSERVICE
  website:
    build: website
    image: website:test
    restart: unless-stopped

  #     BACKEND MICORSERVICE
  authentication:
    # build: authentication
    build:
      context: .                                                  # Set workdir to the repo's root
      dockerfile: ./backend/authentication/Dockerfile    # Point to the Dockerfile's relative path
    image: authentication:test
    container_name: authentication
    pull_policy: build
    restart: unless-stopped
    environment:
      DB_HOST: ${POSTGRES_HOST}                             # DB_HOST is a standard industry convention
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD_FILE: /run/secrets/db_admin_password
    env_file:
      - .env                                              # Loads global configs
    secrets:
      - db_admin_password
    networks:
      - transcendence
      - database
    depends_on:
      migrator:
        condition: service_completed_successfully  # Waits for migrator to finish and exit with code 0

  #     BACKEND MICORSERVICE
  party_manager:
    # build: party-manager
    build:
      context: .                                                  # Set workdir to the repo's root
      dockerfile: ./backend/party-manager/Dockerfile    # Point to the Dockerfile's relative path
    image: party:test
    pull_policy: build
    container_name: party-manager
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://authentication:3000
      GAME_SERVICE_URL: http://game:3000
      DB_HOST: ${POSTGRES_HOST}          # DB_HOST is a standard industry convention
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD_FILE: /run/secrets/db_admin_password
    env_file:
      - .env                                              # Loads global configs
    secrets:
      - db_admin_password
    networks:
      - transcendence
      - database
    depends_on:
      migrator:
        condition: service_completed_successfully  # Waits for migrator to finish and exit with code 0

  #     BACKEND MICORSERVICE
  game:
    build: game
    image: game:test
    restart: unless-stopped
