name: big2

services:
  nginx:
    build: nginx
    image: nginx:test
    ports:
      - "80:80"
    restart: unless-stopped
  
  website:
    build: website
    image: website:test
    restart: unless-stopped
  
  authentication:
    build: backend-auth
    image: authentication:test
    restart: unless-stopped

  party_manager:
    build: party-manager
    image: party:test
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://authentication:3000
      GAME_SERVICE_URL: http://game:3000

  game:
    build: game
    image: game:test
    restart: unless-stopped
