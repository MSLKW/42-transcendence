error_log /var/log/nginx/error.log warn;
error_log /dev/stderr warn;

worker_processes 1;

events {
	worker_connections 1024;
}

http {
	access_log off;
	
	# proxy_buffer_size 128k;
	# proxy_buffers 4 256k;
	# proxy_busy_buffers_size 256k;

	proxy_buffering off;

	include /etc/nginx/conf.d/*.conf;
}
