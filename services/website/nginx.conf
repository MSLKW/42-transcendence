server {
	listen 5173;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	location = /index.html {
		add_header Cache-Control "no-cache" always;
	}

	location /assets/ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
