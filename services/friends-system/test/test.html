<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>friends-system tester</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 20px auto; background: #1e1e1e; color: #ddd; }
  h2 { margin-top: 24px; color: #fff; }
  input, button { padding: 6px; margin: 2px 0; background: #2d2d2d; color: #ddd; border: 1px solid #555; border-radius: 4px; }
  button { cursor: pointer; }
  button:hover { background: #3a3a3a; }
  #uuid-box { padding: 10px; background: #2a2a40; border-radius: 6px; }
  ul { padding-left: 0; list-style: none; }
  li { padding: 6px; border: 1px solid #444; border-radius: 4px; margin: 4px 0; display: flex; justify-content: space-between; align-items: center; background: #262626; }
  .log { background: #151515; height: 160px; overflow-y: auto; font-size: 12px; padding: 8px; border: 1px solid #444; color: #9c9; }
  button.accept { background: #1f4d1f; color: #cfc; }
  button.reject, button.remove { background: #4d1f1f; color: #fcc; }
</style>
</head>
<body>

<div id="uuid-box">
  <b>My UUID:</b>
  <!-- <input id="my-uuid" placeholder="e.g. alice" /> -->
  <input id="my-uuid" placeholder="e.g. alice" onkeydown="if(event.key==='Enter') start()" />
  <button onclick="start()">Connect</button>
  <button onclick="disconnect()">Disconnect</button> 
  <button onclick="openTab()">+ Open another tester tab</button>
  <div id="status" style="margin-top:6px; font-size:13px;">⚪ not connected</div>
</div>

<h2>Send a friend request</h2>
<!-- <input id="target-uuid" placeholder="friend's uuid" /> -->
<input id="target-uuid" placeholder="friend's uuid" onkeydown="if(event.key==='Enter') sendRequest()" />
<button onclick="sendRequest()">Send request</button>

<h2>Inbox (received, pending)</h2>
<ul id="inbox"></ul>

<h2>Sent requests</h2>
<ul id="sent"></ul>

<!-- <h2>Friends list</h2> -->
<h2>Friends list <button onclick="refreshFriends()" style="font-size:12px;">Refresh</button></h2>
<ul id="friends"></ul>

<h2>Notification log</h2>
<div class="log" id="log"></div>

<script>
const API = "http://localhost:3000";
let myUuid = null;
let evtSource = null;   // single shared connection — never a local `const` inside start()
let pollTimer = null;   // single shared timer, same reason

function log(msg) {
  const el = document.getElementById("log");
  el.innerHTML = `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>` + el.innerHTML;
}

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

function openTab() {
  window.open(window.location.pathname, "_blank");
}

function start() {
  // bug 1 fix: refuse to open a second connection if one is already open
  if (evtSource) return log("already connected — click Disconnect first to reconnect");
  //
  myUuid = document.getElementById("my-uuid").value.trim();
  if (!myUuid) return alert("enter a uuid first");
  document.title = "tester: " + myUuid;

  // const evtSource = new EventSource(`${API}/events?uuid=${myUuid}`);
  evtSource = new EventSource(`${API}/events?uuid=${myUuid}`);
  // evtSource.addEventListener("connected", () => log("SSE connected as " + myUuid));
  evtSource.addEventListener("connected", () => {
    log("SSE connected as " + myUuid);
    setStatus("🟢 live (SSE connected)");
  });
  evtSource.onerror = () => setStatus("🔴 disconnected — use Refresh until this reconnects");


  evtSource.addEventListener("friend_request_received", e => {
    const data = JSON.parse(e.data);
    log(`Friend request received from ${data.senderId}`);
    refreshInbox();
  });

  evtSource.addEventListener("friend_request_accepted", e => {
    const data = JSON.parse(e.data);
    log(`${data.by} accepted your friend request`);
    refreshSent();
  });

  evtSource.addEventListener("friend_request_rejected", e => {
    const data = JSON.parse(e.data);
    log(`${data.by} rejected your friend request`);
    refreshSent();
  });

  evtSource.addEventListener("friends_list_updated", e => {
    const data = JSON.parse(e.data);
    if (data.newFriend) log(`${data.newFriend} is now your friend`);
    if (data.removedFriend) log(`Removed ${data.removedFriend} from your friends`);
    refreshFriends();
  });

  refreshInbox(); refreshSent(); refreshFriends();
  // setInterval(refreshFriends, 5000);
  pollTimer = setInterval(refreshFriends, 5000);
  window.addEventListener("focus", refreshFriends);
}

// async function sendRequest() {
//   const target = document.getElementById("target-uuid").value.trim();
//   const res = await fetch(`${API}/friend-requests`, {
//     method: "POST", headers: { "Content-Type": "application/json" },
//     body: JSON.stringify({ senderId: myUuid, receiverId: target })
//   });
//   const data = await res.json();
//   log(res.ok ? `Sent request to ${target}` : `Error: ${data.error}`);
//   refreshSent();
// }

//
function disconnect() {
  if (!evtSource) return log("already disconnected");
  evtSource.close();
  evtSource = null;
  clearInterval(pollTimer);
  pollTimer = null;
  setStatus("⚪ not connected");
  log(`SSE disconnected as ${myUuid} — live updates paused until you Connect again.`);
}
//

async function sendRequest() {
  const input = document.getElementById("target-uuid");
  const target = input.value.trim();
  //
  // bug 6 fix: don't even attempt the request if the field is empty
  if (!target) 
    return log("enter a friend's uuid before sending a request");
  input.value = "";  // ← this clears the box immediately
  //
  const res = await fetch(`${API}/friend-requests`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ senderId: myUuid, receiverId: target })
  });
  const data = await res.json();
  if (res.ok) {
    log(`Sent request to ${target}`);
  } else if (data.requestId) {
    log(`${target} already sent you a request — check your inbox below to respond`);
  } else {
    log(`Error: ${data.error}`);
  }
  refreshSent();
}

async function refreshInbox() {
  const res = await fetch(`${API}/friend-requests/received?uuid=${myUuid}`);
  const requests = await res.json();
  const list = document.getElementById("inbox");
  list.innerHTML = "";
  requests.forEach(r => {
    const li = document.createElement("li");
    li.innerHTML = `${r.senderId}
      <span>
        <button class="accept" onclick="respond('${r.id}','accept')">accept</button>
        <button class="reject" onclick="respond('${r.id}','reject')">reject</button>
      </span>`;
    list.appendChild(li);
  });
}

async function respond(id, action) {
  // await fetch(`${API}/friend-requests/${id}/${action}`, { method: "POST" });
    const res = await fetch(`${API}/friend-requests/${id}/${action}`, { method: "POST" });
  if (!res.ok) {
    const data = await res.json();
    log(`Error: ${data.error}`);
  }
  refreshInbox(); refreshFriends();
}

async function refreshSent() {
  const res = await fetch(`${API}/friend-requests/sent?uuid=${myUuid}`);
  const requests = await res.json();
  const list = document.getElementById("sent");
  list.innerHTML = "";
  requests.forEach(r => {
    const li = document.createElement("li");
    li.textContent = `${r.receiverId} — ${r.status}`;
    list.appendChild(li);
  });
}

async function refreshFriends() {
  const res = await fetch(`${API}/friends?uuid=${myUuid}`);
  const friends = await res.json();
  const list = document.getElementById("friends");
  list.innerHTML = "";
  friends.forEach(f => {
    const li = document.createElement("li");
    li.innerHTML = `${f} <button class="remove" onclick="removeFriend('${f}')">remove</button>`;
    list.appendChild(li);
  });
}

async function removeFriend(friendUuid) {
  // await fetch(`${API}/friends/${friendUuid}?uuid=${myUuid}`, { method: "DELETE" });
  const res = await fetch(`${API}/friends/${friendUuid}?uuid=${myUuid}`, { method: "DELETE" });
  if (res.status === 404) log(`${friendUuid} was already removed (they removed you first)`);
  refreshFriends();
}
</script>
</body>
</html>
