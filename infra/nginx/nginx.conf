error_log /dev/stderr warn; # symlink to below by default in official nginx image Dockerfile.
# error_log /var/log/nginx/error.log warn; # having both causing the same error logged twice

worker_processes 1;

events {
	worker_connections 1024;
}

http {
	access_log off;
	
	# proxy_buffer_size 128k;
	# proxy_buffers 4 256k;
	# proxy_busy_buffers_size 256k;

	# Buffering is nginx's default
	# Buffering lets slow clients drain a response from nginx's memory instead of holding a backend connection open;
	# only streaming routes (SSE in /api/friends/) need it off, so it is set there instead of globally.
	# discussed first before commenting it
	proxy_buffering off;

	include /etc/nginx/conf.d/*.conf;
}
