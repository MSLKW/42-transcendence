services:
  website:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/website:/app/services/website
    environment:
      DOMAIN_PORT: ${DOMAIN_PORT:?}
      VITE_API_AUTH_PATH: ${API_AUTH_PATH:?}
      VITE_API_PROFILE_PATH: ${API_PROFILE_PATH:?}
      VITE_API_PARTY_PATH: ${API_PARTY_PATH:?}
      VITE_API_FRIENDS_PATH: ${API_FRIENDS_PATH:?}
      VITE_API_GAME_STATS_PATH: ${API_GAME_STATS_PATH:?}
      VITE_SOCKET_CHAT_PATH: ${SOCKET_CHAT_PATH:?}
      VITE_SOCKET_PARTY_PATH: ${SOCKET_PARTY_PATH:?}
      VITE_SOCKET_GAME_SERVER_PATH: ${SOCKET_GAME_SERVER_PATH:?}
      VITE_SOCKET_GAME_BOT_PATH: ${SOCKET_GAME_BOT_PATH:?}
      VITE_SOCKET_URL: ${SOCKET_URL:?}
      SHOW_DEV_SECTION: ${SHOW_DEV_SECTION:-false}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
